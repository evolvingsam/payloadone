[tool.poetry]
name = "payloadone"
version = "0.1.0"
description = "A Python SDK for secure, normalised, idempotent webhook processing from Paystack and Flutterwave."
authors = ["PayloadOne Contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/your-org/payloadone"
repository = "https://github.com/your-org/payloadone"
keywords = ["webhooks", "paystack", "flutterwave", "payments", "idempotency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
packages = [{ include = "payloadone" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = { version = "^2.0", extras = ["email"] }
redis = { version = "^5.0", optional = true }
asyncpg = { version = "^0.29", optional = true }
psycopg2-binary = { version = "^2.9", optional = true }
fastapi = { version = "*", optional = true }
django = { version = "*", optional = true }
flask = { version = "*", optional = true }

[tool.poetry.extras]
redis = ["redis"]
postgres = ["asyncpg", "psycopg2-binary"]
fastapi = ["fastapi"]
django = ["django"]
flask = ["flask"]
all = ["redis", "asyncpg", "psycopg2-binary", "fastapi", "django", "flask"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"
fakeredis = "^2.23"
fastapi = "*"
flask = "*"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=payloadone --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"